name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MinGW-w64 (MSYS2)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          release: false
          install: mingw-w64-x86_64-gcc

      - name: Compile
        shell: msys2 {0}
        run: |
          windres version.rc -O coff -o version.res
          g++ -Os -s -std=c++17 -static -static-libgcc -static-libstdc++ \
              main.cpp port_checker.cpp process_manager.cpp version.res \
              -o port_checker.exe \
              -lws2_32 -liphlpapi -lpsapi -lversion -lshell32 -mconsole

      - name: Smoke test
        shell: pwsh
        run: .\tests\run_tests.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PortLens-win64
          path: port_checker.exe

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: port_checker.exe
