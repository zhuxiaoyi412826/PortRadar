[package]
name = "portlens-gui"
version = "0.8.1"
edition = "2021"

# 产物直接命名为 port.exe，与 CLI 单文件同名
[[bin]]
name = "port"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
